# Xcode project for iPhone, iPad and Mac, made with XcodeGen:
#   brew install xcodegen && cd ios && xcodegen
# Then open DeltaRun.xcodeproj. See docs/mobile.md, and docs/publishing.md
# for the App Store.
#
# The game itself is built by cargo (build-rust.sh); Xcode only wraps it in
# an app, signs it and puts it on the phone. main.c is a stand-in that the
# Rust program replaces before signing.
name: DeltaRun
options:
  bundleIdPrefix: io.github.akaco
  deploymentTarget:
    iOS: "15.0"
    macOS: "11.0"
settings:
  base:
    # Pick your team in Xcode (Signing & Capabilities), or put its ID here.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEBUG_INFORMATION_FORMAT: dwarf
    ENABLE_BITCODE: NO
    # The version players see; raise CURRENT_PROJECT_VERSION by one for every
    # upload to App Store Connect.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  DeltaRun:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: main.c
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.akaco.deltarun
        PRODUCT_NAME: DeltaRun
        TARGETED_DEVICE_FAMILY: "1,2"
        # The simulator on an Apple Silicon Mac runs arm64 only.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Delta Run
        # the game sends nothing anywhere, so no export paperwork
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    postBuildScripts:
      - name: Build the game with cargo
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false

  # The Mac version: the same game in a window. Same bundle ID as the phone
  # version, so App Store Connect sells both under one app.
  DeltaRunMac:
    type: application
    platform: macOS
    deploymentTarget: "11.0"
    sources:
      - path: main.c
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.akaco.deltarun
        PRODUCT_NAME: Delta Run
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: DeltaRun.entitlements
      properties:
        # the Mac App Store only takes sandboxed apps; the game needs no
        # other permissions
        com.apple.security.app-sandbox: true
    info:
      path: MacInfo.plist
      properties:
        CFBundleDisplayName: Delta Run
        LSApplicationCategoryType: public.app-category.arcade-games
        ITSAppUsesNonExemptEncryption: false
        NSHighResolutionCapable: true
    postBuildScripts:
      - name: Build the game with cargo
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false
